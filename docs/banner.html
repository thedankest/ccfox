<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ccfox banner</title>
<!-- Source for docs/banner.png (1280x640, also the GitHub social preview). Render with:
     zen --headless -no-remote -profile <tmp> --screenshot docs/banner.png --window-size=1280,640 file://.../docs/banner.html -->
<style>
  :root {
    --bg: #161412;
    --ink: #f3efe6;
    --ink-2: #a8a296;
    --ink-3: #8b8579;
    --fox: #E8682A;
    --fox-deep: #c2501b;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --px: 20px; /* one fox pixel */
  }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    background-color: var(--bg);
    /* faint dot grid on the fox's own pixel pitch, aligned to its pixel corners */
    background-image: radial-gradient(circle at 0 0, rgb(243 239 230 / 0.09) 1.2px, transparent 1.6px);
    background-size: var(--px) var(--px);
    background-position: 0 10px;
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  svg.fox {
    position: absolute; left: 140px; top: 190px;
    width: calc(19 * var(--px)); height: calc(13 * var(--px));
    shape-rendering: crispEdges; image-rendering: pixelated;
  }
  .copy {
    position: absolute; left: 600px; right: 40px; top: 0; bottom: 12px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .word {
    font: 700 136px/0.9 var(--mono);
    letter-spacing: -0.045em;
    margin: 0 0 34px -7px;
  }
  .word .fx { color: var(--fox); }
  .tag {
    font: 500 31px/1.28 var(--sans);
    letter-spacing: -0.012em;
    margin: 0;
  }
  .tag span { display: block; color: var(--ink-2); }
  .meta {
    display: flex; gap: 12px; align-items: center;
    margin-top: 38px;
    font: 500 19px/1 var(--mono);
    color: var(--ink-3);
  }
  .meta i { width: 7px; height: 7px; background: var(--fox-deep); display: inline-block; }
  /* one row of fox pixels along the bottom edge */
  .strip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
    background: repeating-linear-gradient(90deg, var(--fox) 0 var(--px), var(--fox-deep) var(--px) calc(2 * var(--px)));
  }
</style>
</head>
