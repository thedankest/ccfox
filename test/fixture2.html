<!doctype html>
<html>
<head><meta charset="utf-8"><title>ccfox Fixture 2</title>
<style>body { font-family: sans-serif; margin: 20px; } main { padding-top: 40px; }</style>
</head>
<body>
  <main>
    <h1>Second page</h1>
    <button id="approve" onclick="this.textContent = 'Approved'">Approve request</button>
    <form id="f2" aria-label="Comment">
      <label for="comment">Comment</label>
      <input id="comment" name="comment">
      <button type="submit">Post</button>
    </form>
    <p id="posted">not posted</p>
  </main>
<script>
  document.getElementById('f2').addEventListener('submit', (e) => { e.preventDefault(); document.getElementById('posted').textContent = 'posted ' + document.getElementById('comment').value; });
</script>
</body>
</html>
